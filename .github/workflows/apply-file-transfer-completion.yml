name: Apply File Transfer Completion Acknowledgement

on:
  push:
    branches: [feature/file-clipboard]
    paths:
      - .github/workflows/apply-file-transfer-completion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/file-clipboard
          fetch-depth: 0

      - name: Apply completion acknowledgement
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/lib/deskflow/ProtocolTypes.cpp",
              'const char *const kMsgDFileClipboardReady = "FCRD%s";\n',
              'const char *const kMsgDFileClipboardReady = "FCRD%s";\n'
              'const char *const kMsgDFileClipboardComplete = "FCOK%s";\n',
          )

          replace_once(
              "src/lib/deskflow/ProtocolTypes.h",
              'extern const char *const kMsgDFileClipboardEnd;    // FCEN%s%s\n'
              'extern const char *const kMsgDFileClipboardReady;  // FCRD%s\n',
              'extern const char *const kMsgDFileClipboardEnd;      // FCEN%s%s\n'
              'extern const char *const kMsgDFileClipboardReady;    // FCRD%s\n'
              'extern const char *const kMsgDFileClipboardComplete; // FCOK%s\n',
          )

          replace_once(
              "src/lib/server/ClientProxy1_9.h",
              '  void sendFileEnd(const std::string &id, const std::string &digest) const;\n'
              '  void sendFileReady(const std::string &id) const;\n',
              '  void sendFileEnd(const std::string &id, const std::string &digest) const;\n'
              '  void sendFileReady(const std::string &id) const;\n'
              '  void sendFileComplete(const std::string &id) const;\n',
          )

          replace_once(
              "src/lib/server/ClientProxy1_9.cpp",
              '  } else if (memcmp(code, kMsgDFileClipboardReady, 4) == 0) {\n'
              '    if (!ProtocolUtil::readf(getStream(), kMsgDFileClipboardReady + 4, &first))\n'
              '      return false;\n'
              '    getServer()->fileTransferReady(this, first);\n'
              '  } else {\n',
              '  } else if (memcmp(code, kMsgDFileClipboardReady, 4) == 0) {\n'
              '    if (!ProtocolUtil::readf(getStream(), kMsgDFileClipboardReady + 4, &first))\n'
              '      return false;\n'
              '    getServer()->fileTransferReady(this, first);\n'
              '  } else if (memcmp(code, kMsgDFileClipboardComplete, 4) == 0) {\n'
              '    if (!ProtocolUtil::readf(getStream(), kMsgDFileClipboardComplete + 4, &first))\n'
              '      return false;\n'
              '    getServer()->fileTransferComplete(this, first);\n'
              '  } else {\n',
          )

          replace_once(
              "src/lib/server/ClientProxy1_9.cpp",
              'void ClientProxy1_9::sendFileReady(const std::string &id) const\n'
              '{\n'
              '  ProtocolUtil::writef(getStream(), kMsgDFileClipboardReady, &id);\n'
              '}\n',
              'void ClientProxy1_9::sendFileReady(const std::string &id) const\n'
              '{\n'
              '  ProtocolUtil::writef(getStream(), kMsgDFileClipboardReady, &id);\n'
              '}\n\n'
              'void ClientProxy1_9::sendFileComplete(const std::string &id) const\n'
              '{\n'
              '  ProtocolUtil::writef(getStream(), kMsgDFileClipboardComplete, &id);\n'
              '}\n',
          )

          replace_once(
              "src/lib/client/ServerProxy.h",
              '  void onFileTransferEnd(const std::string &id, const std::string &digest);\n'
              '  void onFileTransferReady(const std::string &id);\n',
              '  void onFileTransferEnd(const std::string &id, const std::string &digest);\n'
              '  void onFileTransferReady(const std::string &id);\n'
              '  void onFileTransferComplete(const std::string &id);\n',
          )

          replace_once(
              "src/lib/client/ServerProxy.cpp",
              '  else if (memcmp(code, kMsgDFileClipboardReady, 4) == 0) {\n'
              '    std::string id;\n'
              '    ProtocolUtil::readf(m_stream, kMsgDFileClipboardReady + 4, &id);\n'
              '    m_client->fileTransferReady(id);\n'
              '  }\n\n'
              '  else if (memcmp(code, kMsgCResetOptions, 4) == 0) {\n',
              '  else if (memcmp(code, kMsgDFileClipboardReady, 4) == 0) {\n'
              '    std::string id;\n'
              '    ProtocolUtil::readf(m_stream, kMsgDFileClipboardReady + 4, &id);\n'
              '    m_client->fileTransferReady(id);\n'
              '  }\n\n'
              '  else if (memcmp(code, kMsgDFileClipboardComplete, 4) == 0) {\n'
              '    std::string id;\n'
              '    ProtocolUtil::readf(m_stream, kMsgDFileClipboardComplete + 4, &id);\n'
              '    m_client->fileTransferComplete(id);\n'
              '  }\n\n'
              '  else if (memcmp(code, kMsgCResetOptions, 4) == 0) {\n',
          )

          replace_once(
              "src/lib/client/ServerProxy.cpp",
              'void ServerProxy::onFileTransferReady(const std::string &id)\n'
              '{\n'
              '  ProtocolUtil::writef(m_stream, kMsgDFileClipboardReady, &id);\n'
              '}\n',
              'void ServerProxy::onFileTransferReady(const std::string &id)\n'
              '{\n'
              '  ProtocolUtil::writef(m_stream, kMsgDFileClipboardReady, &id);\n'
              '}\n\n'
              'void ServerProxy::onFileTransferComplete(const std::string &id)\n'
              '{\n'
              '  ProtocolUtil::writef(m_stream, kMsgDFileClipboardComplete, &id);\n'
              '}\n',
          )

          replace_once(
              "src/lib/client/Client.h",
              '  void fileTransferEnd(const std::string &id, const std::string &digest);\n'
              '  void fileTransferReady(const std::string &id);\n'
              '  void localFileTransferDecision(const QString &id, bool accepted);\n',
              '  void fileTransferEnd(const std::string &id, const std::string &digest);\n'
              '  void fileTransferReady(const std::string &id);\n'
              '  void fileTransferComplete(const std::string &id);\n'
              '  void localFileTransferDecision(const QString &id, bool accepted);\n',
          )

          replace_once(
              "src/lib/client/Client.h",
              '  std::unique_ptr<deskflow::filetransfer::OutgoingFile> m_outgoingFile;\n'
              '  std::unique_ptr<deskflow::filetransfer::IncomingFile> m_incomingFile;\n',
              '  std::unique_ptr<deskflow::filetransfer::OutgoingFile> m_outgoingFile;\n'
              '  std::unique_ptr<deskflow::filetransfer::IncomingFile> m_incomingFile;\n'
              '  bool m_outgoingFileAwaitingCompletion = false;\n',
          )

          replace_once(
              "src/lib/client/Client.cpp",
              '  if (m_enableClipboard && m_serverSupportsFileTransfer && m_server != nullptr && !m_outgoingFile) {\n',
              '  if (m_enableClipboard && m_serverSupportsFileTransfer && m_server != nullptr && !m_outgoingFile &&\n'
              '      !m_outgoingFileAwaitingCompletion) {\n',
          )

          replace_once(
              "src/lib/client/Client.cpp",
              '      m_server->onFileTransferCancel(m_localFileOffer->id.toStdString(), "replaced by a newer file clipboard offer");\n'
              '      m_localFileOffer.reset();\n',
              '      m_server->onFileTransferCancel(m_localFileOffer->id.toStdString(), "replaced by a newer file clipboard offer");\n'
              '      m_outgoingFileAwaitingCompletion = false;\n'
              '      m_localFileOffer.reset();\n',
          )

          replace_once(
              "src/lib/client/Client.cpp",
              '      m_localFileOffer = std::move(offer);\n'
              '      m_server->onFileTransferOffer(m_localFileOffer->toWire().toStdString());\n',
              '      m_outgoingFileAwaitingCompletion = false;\n'
              '      m_localFileOffer = std::move(offer);\n'
              '      m_server->onFileTransferOffer(m_localFileOffer->toWire().toStdString());\n',
          )

          replace_once(
              "src/lib/client/Client.cpp",
              '  if (info->m_id == kClipboardClipboard && m_serverSupportsFileTransfer && m_localFileOffer && !m_outgoingFile) {\n'
              '    m_server->onFileTransferCancel(m_localFileOffer->id.toStdString(), "source clipboard changed");\n'
              '    m_localFileOffer.reset();\n'
              '  }\n',
              '  if (info->m_id == kClipboardClipboard && m_serverSupportsFileTransfer && m_localFileOffer && !m_outgoingFile &&\n'
              '      !m_outgoingFileAwaitingCompletion) {\n'
              '    m_server->onFileTransferCancel(m_localFileOffer->id.toStdString(), "source clipboard changed");\n'
              '    m_outgoingFileAwaitingCompletion = false;\n'
              '    m_localFileOffer.reset();\n'
              '  }\n',
          )

          replace_once(
              "src/lib/client/Client.cpp",
              'void Client::fileTransferAccept(const std::string &id)\n'
              '{\n'
              '  if (!m_server || !m_localFileOffer || m_localFileOffer->id.toStdString() != id)\n'
              '    return;\n\n'
              '  m_outgoingFile = std::make_unique<deskflow::filetransfer::OutgoingFile>();\n',
              'void Client::fileTransferAccept(const std::string &id)\n'
              '{\n'
              '  if (!m_server || !m_localFileOffer || m_localFileOffer->id.toStdString() != id || m_outgoingFile ||\n'
              '      m_outgoingFileAwaitingCompletion)\n'
              '    return;\n\n'
              '  m_outgoingFileAwaitingCompletion = false;\n'
              '  m_outgoingFile = std::make_unique<deskflow::filetransfer::OutgoingFile>();\n',
          )

          replace_once(
              "src/lib/client/Client.cpp",
              '  if (m_outgoingFile->atEnd()) {\n'
              '    const auto id = m_localFileOffer->id.toStdString();\n'
              '    m_server->onFileTransferEnd(id, m_outgoingFile->digest().toStdString());\n'
              '    m_outgoingFile.reset();\n'
              '    m_localFileOffer.reset();\n'
              '    return;\n'
              '  }\n',
              '  if (m_outgoingFile->atEnd()) {\n'
              '    const auto id = m_localFileOffer->id.toStdString();\n'
              '    m_server->onFileTransferEnd(id, m_outgoingFile->digest().toStdString());\n'
              '    m_outgoingFile.reset();\n'
              '    m_outgoingFileAwaitingCompletion = true;\n'
              '    return;\n'
              '  }\n',
          )

          replace_once(
              "src/lib/client/Client.cpp",
              'void Client::fileTransferReady(const std::string &id)\n'
              '{\n'
              '  if (m_localFileOffer && m_outgoingFile && m_localFileOffer->id.toStdString() == id)\n'
              '    m_events->addEvent(Event(EventTypes::FileTransferSendNext, this));\n'
              '}\n',
              'void Client::fileTransferReady(const std::string &id)\n'
              '{\n'
              '  if (m_localFileOffer && m_outgoingFile && m_localFileOffer->id.toStdString() == id)\n'
              '    m_events->addEvent(Event(EventTypes::FileTransferSendNext, this));\n'
              '}\n\n'
              'void Client::fileTransferComplete(const std::string &id)\n'
              '{\n'
              '  if (!m_localFileOffer || m_localFileOffer->id.toStdString() != id || !m_outgoingFileAwaitingCompletion)\n'
              '    return;\n\n'
              '  m_outgoingFile.reset();\n'
              '  m_outgoingFileAwaitingCompletion = false;\n'
              '  m_localFileOffer.reset();\n'
              '}\n',
          )

          replace_once(
              "src/lib/client/Client.cpp",
              '  reportFileTransferProgress(deskflow::filetransfer::Status::Ready, QStringLiteral("Ready to paste"));\n'
              '  m_incomingFile.reset();\n'
              '  m_incomingFileOffer.reset();\n',
              '  reportFileTransferProgress(deskflow::filetransfer::Status::Ready, QStringLiteral("Ready to paste"));\n'
              '  m_server->onFileTransferComplete(id);\n'
              '  m_incomingFile.reset();\n'
              '  m_incomingFileOffer.reset();\n',
          )

          replace_once(
              "src/lib/client/Client.cpp",
              '  if (isOutgoing)\n'
              '    m_localFileOffer.reset();\n',
              '  if (isOutgoing) {\n'
              '    m_outgoingFileAwaitingCompletion = false;\n'
              '    m_localFileOffer.reset();\n'
              '  }\n',
          )

          replace_once(
              "src/lib/server/Server.h",
              '  void fileTransferEnd(BaseClientProxy *source, const std::string &id, const std::string &digest);\n'
              '  void fileTransferReady(BaseClientProxy *target, const std::string &id);\n'
              '  void localFileTransferDecision(const QString &id, bool accepted);\n',
              '  void fileTransferEnd(BaseClientProxy *source, const std::string &id, const std::string &digest);\n'
              '  void fileTransferReady(BaseClientProxy *target, const std::string &id);\n'
              '  void fileTransferComplete(BaseClientProxy *target, const std::string &id);\n'
              '  void localFileTransferDecision(const QString &id, bool accepted);\n',
          )

          replace_once(
              "src/lib/server/Server.h",
              '    std::unique_ptr<deskflow::filetransfer::IncomingFile> incoming;\n'
              '    bool accepted = false;\n',
              '    std::unique_ptr<deskflow::filetransfer::IncomingFile> incoming;\n'
              '    bool accepted = false;\n'
              '    bool awaitingCompletion = false;\n',
          )

          replace_once(
              "src/lib/server/Server.cpp",
              '  if (m_fileTransfer->outgoing->atEnd()) {\n'
              '    target->sendFileEnd(m_fileTransfer->offer.id.toStdString(), m_fileTransfer->outgoing->digest().toStdString());\n'
              '    m_fileTransfer.reset();\n'
              '    return;\n'
              '  }\n',
              '  if (m_fileTransfer->outgoing->atEnd()) {\n'
              '    target->sendFileEnd(m_fileTransfer->offer.id.toStdString(), m_fileTransfer->outgoing->digest().toStdString());\n'
              '    m_fileTransfer->outgoing.reset();\n'
              '    m_fileTransfer->awaitingCompletion = true;\n'
              '    return;\n'
              '  }\n',
          )

          replace_once(
              "src/lib/server/Server.cpp",
              'void Server::fileTransferData(BaseClientProxy *source, const std::string &id, const std::string &data)\n'
              '{\n'
              '  if (!m_fileTransfer || m_fileTransfer->source != source || m_fileTransfer->offer.id.toStdString() != id)\n'
              '    return;\n',
              'void Server::fileTransferData(BaseClientProxy *source, const std::string &id, const std::string &data)\n'
              '{\n'
              '  if (!m_fileTransfer || m_fileTransfer->source != source || m_fileTransfer->offer.id.toStdString() != id ||\n'
              '      m_fileTransfer->awaitingCompletion)\n'
              '    return;\n',
          )

          replace_once(
              "src/lib/server/Server.cpp",
              'void Server::fileTransferEnd(BaseClientProxy *source, const std::string &id, const std::string &digest)\n'
              '{\n'
              '  if (!m_fileTransfer || m_fileTransfer->source != source || m_fileTransfer->offer.id.toStdString() != id)\n'
              '    return;\n'
              '  if (m_fileTransfer->target != m_primaryClient) {\n'
              '    if (auto *target = dynamic_cast<ClientProxy1_9 *>(m_fileTransfer->target))\n'
              '      target->sendFileEnd(id, digest);\n'
              '    m_fileTransfer.reset();\n'
              '    return;\n'
              '  }\n\n'
              '  reportFileTransferProgress(deskflow::filetransfer::Status::Verifying);\n',
              'void Server::fileTransferEnd(BaseClientProxy *source, const std::string &id, const std::string &digest)\n'
              '{\n'
              '  if (!m_fileTransfer || m_fileTransfer->source != source || m_fileTransfer->offer.id.toStdString() != id ||\n'
              '      !m_fileTransfer->accepted || m_fileTransfer->awaitingCompletion)\n'
              '    return;\n'
              '  m_fileTransfer->awaitingCompletion = true;\n'
              '  if (m_fileTransfer->target != m_primaryClient) {\n'
              '    if (auto *target = dynamic_cast<ClientProxy1_9 *>(m_fileTransfer->target))\n'
              '      target->sendFileEnd(id, digest);\n'
              '    return;\n'
              '  }\n\n'
              '  reportFileTransferProgress(deskflow::filetransfer::Status::Verifying);\n',
          )

          replace_once(
              "src/lib/server/Server.cpp",
              '  reportFileTransferProgress(deskflow::filetransfer::Status::Ready);\n'
              '  m_fileTransfer.reset();\n'
              '}\n\n'
              'void Server::fileTransferReady(BaseClientProxy *target, const std::string &id)\n',
              '  reportFileTransferProgress(deskflow::filetransfer::Status::Ready);\n'
              '  fileTransferComplete(m_primaryClient, id);\n'
              '}\n\n'
              'void Server::fileTransferReady(BaseClientProxy *target, const std::string &id)\n',
          )

          replace_once(
              "src/lib/server/Server.cpp",
              'void Server::fileTransferReady(BaseClientProxy *target, const std::string &id)\n'
              '{\n'
              '  if (!m_fileTransfer || m_fileTransfer->target != target || m_fileTransfer->offer.id.toStdString() != id)\n'
              '    return;\n'
              '  if (m_fileTransfer->source == m_primaryClient) {\n'
              '    m_events->addEvent(Event(EventTypes::FileTransferSendNext, this));\n'
              '  } else if (auto *source = dynamic_cast<ClientProxy1_9 *>(m_fileTransfer->source)) {\n'
              '    source->sendFileReady(id);\n'
              '  }\n'
              '}\n',
              'void Server::fileTransferReady(BaseClientProxy *target, const std::string &id)\n'
              '{\n'
              '  if (!m_fileTransfer || m_fileTransfer->target != target || m_fileTransfer->offer.id.toStdString() != id ||\n'
              '      m_fileTransfer->awaitingCompletion)\n'
              '    return;\n'
              '  if (m_fileTransfer->source == m_primaryClient) {\n'
              '    m_events->addEvent(Event(EventTypes::FileTransferSendNext, this));\n'
              '  } else if (auto *source = dynamic_cast<ClientProxy1_9 *>(m_fileTransfer->source)) {\n'
              '    source->sendFileReady(id);\n'
              '  }\n'
              '}\n\n'
              'void Server::fileTransferComplete(BaseClientProxy *target, const std::string &id)\n'
              '{\n'
              '  if (!m_fileTransfer || m_fileTransfer->target != target || m_fileTransfer->offer.id.toStdString() != id ||\n'
              '      !m_fileTransfer->awaitingCompletion)\n'
              '    return;\n\n'
              '  if (auto *source = dynamic_cast<ClientProxy1_9 *>(m_fileTransfer->source))\n'
              '    source->sendFileComplete(id);\n'
              '  m_fileTransfer.reset();\n'
              '}\n',
          )
          PY

      - name: Apply Deskflow formatting
        shell: bash
        run: |
          pipx install --global clang-format==20.1.0
          clang-format -i \
            src/lib/deskflow/ProtocolTypes.cpp \
            src/lib/deskflow/ProtocolTypes.h \
            src/lib/server/ClientProxy1_9.cpp \
            src/lib/server/ClientProxy1_9.h \
            src/lib/client/ServerProxy.cpp \
            src/lib/client/ServerProxy.h \
            src/lib/client/Client.cpp \
            src/lib/client/Client.h \
            src/lib/server/Server.cpp \
            src/lib/server/Server.h

      - name: Commit source changes and remove helper
        shell: bash
        run: |
          rm .github/workflows/apply-file-transfer-completion.yml
          git config user.name "Charredrust"
          git config user.email "charles@rustalis.com"
          git add -A
          git commit -m "fix(file-transfer): acknowledge verified completion"
          git push origin HEAD:feature/file-clipboard
