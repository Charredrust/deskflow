# Temporary workflow: remove after Windows CI is green.
name: File Transfer Windows Diagnostics

on:
  push:
    branches: [feature/file-clipboard]

permissions:
  contents: read

env:
  CMAKE_CONFIGURE: "cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON"

jobs:
  windows-diagnostics:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Fancy Checkout
        uses: sithlord48/fancy-checkout@v2

      - name: Setup VC++ environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64
          spectre: true

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.11.2
          vcpkg-triplet: x64-windows-release

      - name: Get version
        uses: ./.github/actions/get-version

      - name: Configure
        shell: pwsh
        run: |
          ${{ env.CMAKE_CONFIGURE }} -G Ninja ${{ steps.get-deps.outputs.vcpkg-cmake-config }} -DPACKAGE_VERSION_LABEL="${{ env.DESKFLOW_PACKAGE_VERSION }}" 2>&1 | Tee-Object -FilePath windows-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and capture diagnostics
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          cmake --build build --config Release -j8 --target package 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: file-transfer-windows-diagnostics
          path: |
            windows-configure.log
            windows-build.log

      - name: Preserve failure status
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1
