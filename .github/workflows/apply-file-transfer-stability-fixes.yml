name: Apply File Transfer Stability Fixes

on:
  push:
    branches: [feature/file-clipboard]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message == 'ci: apply file transfer stability fixes'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/file-clipboard

      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}")
              p.write_text(text.replace(old, new, 1))

          # Client: an outgoing offer is created only when leaving a screen.
          # Clipboard changes cancel only an unapproved pending offer and never
          # replace an already-approved/in-progress transfer.
          replace(
              'src/lib/client/Client.cpp',
              '''  if (m_enableClipboard && m_serverSupportsFileTransfer && m_server != nullptr) {
    m_localFileOffer = m_screen->getFileClipboard();
    if (m_localFileOffer) {
      m_localFileOffer->id = QUuid::createUuid().toString(QUuid::WithoutBraces);
      m_localFileOffer->sourceName = QString::fromStdString(m_name);
      m_server->onFileTransferOffer(m_localFileOffer->toWire().toStdString());
    }
  }
''',
              '''  if (m_enableClipboard && m_serverSupportsFileTransfer && m_server != nullptr && !m_outgoingFile) {
    auto offer = m_screen->getFileClipboard();
    if (m_localFileOffer) {
      m_server->onFileTransferCancel(m_localFileOffer->id.toStdString(), "replaced by a newer file clipboard offer");
      m_localFileOffer.reset();
    }
    if (offer) {
      offer->id = QUuid::createUuid().toString(QUuid::WithoutBraces);
      offer->sourceName = QString::fromStdString(m_name);
      m_localFileOffer = std::move(offer);
      m_server->onFileTransferOffer(m_localFileOffer->toWire().toStdString());
    }
  }
''')

          replace(
              'src/lib/client/Client.cpp',
              '''  if (info->m_id == kClipboardClipboard && m_serverSupportsFileTransfer) {
    m_localFileOffer = m_screen->getFileClipboard();
    if (m_localFileOffer) {
      m_localFileOffer->id = QUuid::createUuid().toString(QUuid::WithoutBraces);
      m_localFileOffer->sourceName = QString::fromStdString(m_name);
    }
  }
''',
              '''  if (info->m_id == kClipboardClipboard && m_serverSupportsFileTransfer && m_localFileOffer &&
      !m_outgoingFile) {
    m_server->onFileTransferCancel(m_localFileOffer->id.toStdString(), "source clipboard changed");
    m_localFileOffer.reset();
  }
''')

          # Server: accepted/in-progress sessions cannot be displaced by mouse
          # movement or a newer source offer.
          replace(
              'src/lib/server/Server.h',
              '''    std::unique_ptr<deskflow::filetransfer::OutgoingFile> outgoing;
    std::unique_ptr<deskflow::filetransfer::IncomingFile> incoming;
''',
              '''    std::unique_ptr<deskflow::filetransfer::OutgoingFile> outgoing;
    std::unique_ptr<deskflow::filetransfer::IncomingFile> incoming;
    bool accepted = false;
''')

          replace(
              'src/lib/server/Server.cpp',
              '''  if (m_fileTransfer)
    failFileTransfer(QStringLiteral("Replaced by a newer file clipboard offer"));
  offer->id = QUuid::createUuid().toString(QUuid::WithoutBraces);
''',
              '''  if (m_fileTransfer) {
    if (m_fileTransfer->accepted)
      return;
    failFileTransfer(QStringLiteral("Replaced by a newer file clipboard offer"));
  }
  offer->id = QUuid::createUuid().toString(QUuid::WithoutBraces);
''')

          replace(
              'src/lib/server/Server.cpp',
              '''  offer->sourceName = QString::fromStdString(source->getName());
  if (m_fileTransfer)
    failFileTransfer(QStringLiteral("Replaced by a newer file clipboard offer"));
  m_fileTransfer.emplace();
''',
              '''  offer->sourceName = QString::fromStdString(source->getName());
  if (m_fileTransfer) {
    if (m_fileTransfer->accepted) {
      if (auto *proxy = dynamic_cast<ClientProxy1_9 *>(source))
        proxy->sendFileCancel(offer->id.toStdString(), "another file transfer is already in progress");
      return;
    }
    failFileTransfer(QStringLiteral("Replaced by a newer file clipboard offer"));
  }
  m_fileTransfer.emplace();
''')

          replace(
              'src/lib/server/Server.cpp',
              '''  reportFileTransferProgress(deskflow::filetransfer::Status::Transferring);
  if (auto *source = dynamic_cast<ClientProxy1_9 *>(m_fileTransfer->source))
''',
              '''  m_fileTransfer->accepted = true;
  reportFileTransferProgress(deskflow::filetransfer::Status::Transferring);
  if (auto *source = dynamic_cast<ClientProxy1_9 *>(m_fileTransfer->source))
''')

          replace(
              'src/lib/server/Server.cpp',
              '''  if (!m_fileTransfer || m_fileTransfer->target != target || m_fileTransfer->offer.id.toStdString() != id)
    return;
  if (m_fileTransfer->source == m_primaryClient) {
''',
              '''  if (!m_fileTransfer || m_fileTransfer->target != target || m_fileTransfer->offer.id.toStdString() != id)
    return;
  m_fileTransfer->accepted = true;
  if (m_fileTransfer->source == m_primaryClient) {
''')

          # Windows: keep the ownership format private and expose a small helper
          # for publishing the marker. Also ignore Deskflow-owned file clipboards
          # so received files are not immediately offered back.
          replace(
              'src/lib/platform/MSWindowsClipboard.h',
              '''  //! Test if clipboard is owned by deskflow
  static bool isOwnedByDeskflow();

  // IClipboard overrides
''',
              '''  //! Test if clipboard is owned by deskflow
  static bool isOwnedByDeskflow();

  //! Mark the currently-open clipboard as owned by deskflow
  static bool markOwnedByDeskflow();

  // IClipboard overrides
''')

          replace(
              'src/lib/platform/MSWindowsClipboard.cpp',
              '''  // mark clipboard as being owned by deskflow
  HGLOBAL data = GlobalAlloc(GMEM_MOVEABLE | GMEM_DDESHARE, 1);
  if (nullptr == SetClipboardData(getOwnershipFormat(), data)) {
    LOG_WARN("failed to set clipboard data");
    GlobalFree(data);
    return false;
  }

  return true;
}
''',
              '''  return markOwnedByDeskflow();
}

bool MSWindowsClipboard::markOwnedByDeskflow()
{
  HGLOBAL data = GlobalAlloc(GMEM_MOVEABLE | GMEM_DDESHARE, 1);
  if (data == nullptr) {
    LOG_WARN("failed to allocate clipboard ownership marker");
    return false;
  }
  if (SetClipboardData(getOwnershipFormat(), data) == nullptr) {
    LOG_WARN("failed to set clipboard ownership marker");
    GlobalFree(data);
    return false;
  }
  return true;
}
''')

          replace(
              'src/lib/platform/MSWindowsScreen.cpp',
              '''  if (!IsClipboardFormatAvailable(CF_HDROP) || !OpenClipboard(m_window))
    return std::nullopt;
''',
              '''  if (MSWindowsClipboard::isOwnedByDeskflow() || !IsClipboardFormatAvailable(CF_HDROP) || !OpenClipboard(m_window))
    return std::nullopt;
''')

          replace(
              'src/lib/platform/MSWindowsScreen.cpp',
              '''  bool success = EmptyClipboard() != FALSE;
  if (success) {
    auto ownership = GlobalAlloc(GMEM_MOVEABLE | GMEM_DDESHARE, 1);
    if (ownership && SetClipboardData(MSWindowsClipboard::getOwnershipFormat(), ownership) == nullptr)
      GlobalFree(ownership);
    if (SetClipboardData(CF_HDROP, dropHandle) == nullptr)
      success = false;
    else
      dropHandle = nullptr; // Clipboard now owns the allocation.
  }
''',
              '''  bool success = EmptyClipboard() != FALSE;
  if (success)
    success = MSWindowsClipboard::markOwnedByDeskflow();
  if (success) {
    if (SetClipboardData(CF_HDROP, dropHandle) == nullptr)
      success = false;
    else
      dropHandle = nullptr; // Clipboard now owns the allocation.
  }
''')

          # macOS: publish a private marker alongside received file URLs and
          # ignore file clipboards carrying that marker until Finder/user copy
          # replaces the pasteboard.
          replace(
              'src/lib/platform/OSXScreen.mm',
              '''  const auto readPasteboard = ^{
    NSPasteboard *pasteboard = [NSPasteboard generalPasteboard];
    NSDictionary *options = @{NSPasteboardURLReadingFileURLsOnlyKey : @YES};
''',
              '''  const auto readPasteboard = ^{
    NSPasteboard *pasteboard = [NSPasteboard generalPasteboard];
    if ([pasteboard availableTypeFromArray:@[ @"org.deskflow.file-transfer" ]] != nil)
      return;
    NSDictionary *options = @{NSPasteboardURLReadingFileURLsOnlyKey : @YES};
''')

          replace(
              'src/lib/platform/OSXScreen.mm',
              '''    NSURL *url = [NSURL fileURLWithPath:[NSString stringWithUTF8String:utf8Path.constData()]];
    success = [pasteboard writeObjects:@[ url ]] == YES;
''',
              '''    NSURL *url = [NSURL fileURLWithPath:[NSString stringWithUTF8String:utf8Path.constData()]];
    success = [pasteboard writeObjects:@[ url ]] == YES;
    if (success)
      success = [pasteboard setString:@"1" forType:@"org.deskflow.file-transfer"] == YES;
''')

          Path('.github/workflows/apply-file-transfer-stability-fixes.yml').unlink()
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "Charredrust"
          git config user.email "charles@rustalis.com"
          git add -A
          git commit -m "fix(file-transfer): stabilize transfer sessions"
          git push origin HEAD:feature/file-clipboard
