name: Format file transfer branch

on:
  push:
    branches: [feature/file-clipboard]

permissions:
  contents: write

jobs:
  clang-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/file-clipboard

      - name: Install clang-format
        run: pipx install --global clang-format==20.1.0

      - name: Apply Deskflow formatting
        run: find src/ -regex '.*\.\(cpp\|hpp\|cc\|cxx\|h\|c\|m\|mm\)' -exec clang-format -i {} \;

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/
          git commit -m "style: apply clang-format"
          git push origin HEAD:feature/file-clipboard
