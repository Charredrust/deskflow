name: Apply Pinned Clang Format

on:
  push:
    branches: [feature/file-clipboard]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/file-clipboard

      - name: Install pinned formatter
        run: pipx install --global clang-format==20.1.0

      - name: Format source
        shell: bash
        run: |
          find src/ -regex '.*\.\(cpp\|hpp\|cc\|cxx\|h\|c\|m\|mm\)' -exec clang-format -i {} \;
          rm .github/workflows/apply-clang-format-file-transfer.yml

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "Charredrust"
          git config user.email "charles@rustalis.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply pinned clang-format"
          git push origin HEAD:feature/file-clipboard
