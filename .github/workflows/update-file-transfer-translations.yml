name: Update file transfer translations

on:
  push:
    branches: [feature/file-clipboard]

permissions:
  contents: write

jobs:
  update-translations:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container: debian:testing
    steps:
      - name: Install Git for checkout
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates

      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/file-clipboard

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          like: debian

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON

      - name: Update translation sources
        run: cmake --build build --target app_translations

      - name: Commit translation updates
        run: |
          git status --short
          git add translations/*.ts
          if git diff --cached --quiet; then
            echo "No translation changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "i18n: update file transfer strings"
          git push origin HEAD:feature/file-clipboard
